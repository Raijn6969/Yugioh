# Alle Tests bei jedem Push und Pull Request auf Windows (wie beim Spielen: Tk, pywin32, Windows-APIs).
# Ohne Tesseract, Kartendatenbank und Bilder (nicht im Repo) – die Tests brauchen sie nicht.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Abhängigkeiten
        run: python -m pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover -s tests -t .
